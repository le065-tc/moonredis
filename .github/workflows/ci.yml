name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update dependencies
        run: moon update

      - name: Format
        run: moon fmt --check .

      - name: Build (native)
        run: moon build --target native

      - name: Check (native)
        run: moon check --deny-warn --target native

      - name: Test (native)
        run: moon test --deny-warn --target native

      - name: Smoke test
        run: python3 scripts/smoke_test.py
